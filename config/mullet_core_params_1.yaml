/**:
  ros__parameters:
    # PX4 instance number. instance 0 uses /fmu/... topics; instance N uses /<prefix>_N/fmu/...
    vehicle_instance: 1
    px4_namespace_prefix: "uav"

    # Soft real-time supervisor loop. PX4's offboard minimum is lower, but this gives jitter margin.
    control_rate_hz: 50.0
    offboard_warmup_s: 1.0
    command_retry_interval_s: 1.0

    # Multicopter takeoff and hover targets use PX4 NED coordinates.
    takeoff_acceptance_m: 0.25
    takeoff_yaw_tolerance_rad: 0.174533
    hover_yaw_rad: 0.0
    min_takeoff_altitude_m: 0.5
    max_takeoff_altitude_m: 10.0
    warmup_timeout_s: 3.0
    request_offboard_timeout_s: 5.0
    disable_offboard_timeout_s: 5.0
    request_arm_timeout_s: 5.0
    takeoff_timeout_s: 20.0
    landing_timeout_s: 30.0
    hover_altitude_tolerance_m: 0.25
    hover_vertical_velocity_tolerance_mps: 0.25
    hover_settle_time_s: 1.0

    # Temporary compatibility command format: std_msgs/Float32MultiArray [vx_ned_mps, vy_ned_mps, mode].
    # Only mode=1 is accepted. Long term, replace this with a typed command message.
    command_topic: "command"
    land_topic: "land_request"
    command_timeout_s: 0.25

    # Safety clamps for external velocity commands.
    max_vx_ned_mps: 1.0
    max_vy_ned_mps: 1.0
    max_vz_ned_mps: 0.5

    # Low-frequency control-loop timing diagnostics.
    timing_log_period_s: 1.0
