/**:
  ros__parameters:
    # PX4 instance number. instance 0 uses /fmu/... topics; instance N uses /<prefix>_N/fmu/...
    vehicle_instance: 0
    px4_namespace_prefix: "uav"
    drone_id: ""
    heartbeat_topic: "/mullet/heartbeat"
    heartbeat_rate_hz: 10.0

    # Soft real-time supervisor loop. PX4's offboard minimum is lower, but this gives jitter margin.
    control_rate_hz: 50.0
    offboard_warmup_s: 1.0
    command_retry_interval_s: 1.0

    # Multicopter takeoff and hold targets use PX4 NED coordinates.
    takeoff_acceptance_m: 0.25
    takeoff_yaw_tolerance_rad: 0.174533
    hover_yaw_rad: 0.0
    min_takeoff_altitude_m: 0.5
    max_takeoff_altitude_m: 10.0
    request_offboard_timeout_s: 5.0
    request_arm_timeout_s: 5.0
    takeoff_timeout_s: 20.0
    landing_timeout_s: 30.0
    hover_altitude_tolerance_m: 0.25
    hover_vertical_velocity_tolerance_mps: 0.25
    hover_settle_time_s: 1.0

    # Return home flies back above the takeoff point at the current altitude, then holds.
    return_home_speed_mps: 2.0
    return_home_acceptance_m: 0.5

    # MISSION command stream: mullet_interfaces/msg/MissionCommand, mode TRAJECTORY (position
    # with velocity and optional acceleration feedforward), VELOCITY (optional acceleration
    # feedforward) or ACCELERATION, planar with the altitude held at the MISSION entry value, or
    # their 3D variants TRAJECTORY_3D / VELOCITY_3D / ACCELERATION_3D, which command z too.
    command_topic: "command"
    command_timeout_s: 0.25
    # A stream stale for this long (mission node crashed or restarted) leaves MISSION for HOLD.
    command_loss_hold_s: 2.0

    # Safety clamps for MISSION commands, per NED axis. A backstop about 0.5 m/s above what
    # the mission frameworks fly (the ergodic field scene: 1.5 m/s, 0.5 m/s vertical), so it
    # only acts when a framework misbehaves; well inside what an X500 V2 flies steadily.
    max_vx_ned_mps: 2.0
    max_vy_ned_mps: 2.0
    max_vz_ned_mps: 0.75
    max_accel_ned_mps2: 3.0
    # How far a TRAJECTORY position may lead the drone; with PX4's position gains near 1 this
    # also bounds the speed PX4 adds to correct the tracking error.
    max_xy_position_lead_m: 1.0
    max_z_position_lead_m: 0.5

    # Low-frequency control-loop timing diagnostics.
    timing_log_period_s: 1.0
