name: Mullet Core CI (PX4 SITL Image)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skymule-ai/px4-sitl:v1.16.1
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p /ws/src
          cp -a . /ws/src/mullet-core

      - name: Clone px4_msgs
        run: |
          git clone -b release/1.17 https://github.com/PX4/px4_msgs.git /ws/src/px4_msgs

      - name: Build mullet_core
        working-directory: /ws
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select mullet_core --symlink-install

# TODO: After validating, narrow triggers to pull_request + push on main.
