name: Mullet Core CI (Base Image)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/skymule-ai/mullet-ros2-base:main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p /ws/src
          cp -a . /ws/src/mullet-core

      - name: Build mullet_core
        working-directory: /ws
        run: |
          colcon build --packages-select mullet_core --symlink-install

# TODO: After validating, narrow triggers to pull_request + push on main.
